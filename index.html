<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
  <section class="">
    <div class="px-4 py-5 px-md-5 text-center text-lg-start" style="background-color: #A6CDC6">
      <div class="container">
        <div class="row gx-lg-5 align-items-center">
          <div class="col-lg-6 mb-5 mb-lg-0">
            <h1 class="my-5 display-3 fw-bold ls-tight">
              <span class="text-primary">Agenda telefónica</span>
            </h1>
            <div class="imgs">
              <img src="image/imagen.png" alt="Agenda">
            </div>
          </div>
          <div class="col-lg-6 mb-5 mb-lg-0">
            <div class="card" style="background-color: #FBF5DD">
              <div class="card-body py-5 px-md-5">
                <form id="formulario">
                  <div class="row">
                    <div class="col-md-6 mb-4">
                      <div data-mdb-input-init class="form-outline">
                        <input type="text" id="nombre" class="form-control" />
                        <label class="form-label" for="nombre">Nombres</label>
                      </div>
                    </div>
                    <div class="col-md-6 mb-4">
                      <div data-mdb-input-init class="form-outline">
                        <input type="text" id="apellido" class="form-control" />
                        <label class="form-label" for="apellido">Apellido</label>
                      </div>
                    </div>
                  </div>
                  <div data-mdb-input-init class="form-outline mb-4">
                    <input type="email" id="correo" class="form-control" />
                    <label class="form-label" for="correo">Correo electrónico</label>
                  </div>
                  <div data-mdb-input-init class="form-outline mb-4">
                    <input type="password" id="contrasena" class="form-control" />
                    <label class="form-label" for="contrasena">Contraseña</label>
                  </div>
                  <button type="button" id="guardarDatos" class="btn btn-primary btn-block mb-4">
                    Iniciar sesión
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  
  <script>
    document.getElementById("guardarDatos").addEventListener("click", function() {
      const nombre = document.getElementById("nombre").value;
      const apellido = document.getElementById("apellido").value;
      const correo = document.getElementById("correo").value;
  
      if (nombre && apellido && correo) {
        localStorage.setItem("nombre", nombre);
        localStorage.setItem("apellido", apellido);
        localStorage.setItem("correo", correo);
  
        window.location.href = "Contactos/contacto.html";
      } else {
        alert("Completa los Campos");
      }
    });
  </script>
  

      

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
