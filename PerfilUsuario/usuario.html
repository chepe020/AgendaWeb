<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil del usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body class="bodys">
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/Contactos/contacto.html">Contactos</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="/NuevosContactos/nuevoContacto.html">Nuevo Contacto</a>
                    <a class="nav-link" href="/Favoritos/favoritos.html">Favoritos</a>
                    <a class="nav-link" href="/ToDoList/todoList.html">ToDo List</a>

                    
                    <div style="margin-left: 1100px;">
                      <a class="nav-link" href="/PerfilUsuario/usuario.html">
                          <img src="/image/usuario.png" alt="" style="height: 50px; width: 50px; ">
                      </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>


    <div class="container mt-5">
        <div class="cuadro">
          <h2 class="mb-4">Datos del Usuario</h2>
          <img src="/image/usuario.png" alt="Usuario" style="width: 100px; height: 100px; margin-left: 130px;">
          <form id="formularioUsuario">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text"class="form-control" id="nombre">
            </div>
            <div class="mb-3">
              <label for="apellido" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="apellido">
            </div>
            <div class="mb-3">
              <label for="correo" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="correo">
            </div>
          </form>
        </div>
    </div>

    <script>
        const nombre = localStorage.getItem("nombre");
        const apellido = localStorage.getItem("apellido");
        const correo = localStorage.getItem("correo");
    
        if (nombre && apellido && correo) {
          document.getElementById("nombre").value = nombre;
          document.getElementById("apellido").value = apellido;
          document.getElementById("correo").value = correo;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
