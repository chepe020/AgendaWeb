<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/ToDoList/todoList.css">
    <title>ToDo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body class="bodys">
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/Contactos/contacto.html">Contactos</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="/NuevosContactos/nuevoContacto.html">Nuevo Contacto</a>
                    <a class="nav-link" href="/Favoritos/favoritos.html">Favoritos</a>
                    <a class="nav-link" href="/ToDoList/todoList.html">ToDo List</a>

                    
                    <div style="margin-left: 1100px;">
                      <a class="nav-link" href="/PerfilUsuario/usuario.html">
                          <img src="/image/usuario.png" alt="" style="height: 50px; width: 50px; ">
                      </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="cuadro">
        <h2 class="mb-4">Lista de Pendientes</h2>
        <input id="Description" class="form-control" type="text" placeholder="Descripción del Pendiente" aria-label="default input example">

        <div class="my-3">
            <select id="Prioridad" class="form-select" aria-label="Default select example">
                <option value="" selected>Selecciona la prioridad</option>
                <option value="1">Alta Importancia</option>
                <option value="2">Importante</option>
                <option value="3">Baja Importancia</option>
            </select>
        </div>

        <button id="Guardar" type="button" class="btn btn-success">Guardar</button>

        <ul id="Mostrar" class="list-group mt-4"></ul>
    </div>

    <script>
        const Description = document.getElementById('Description');
        const Prioridad = document.getElementById('Prioridad');
        const Guardar = document.getElementById('Guardar');
        const Mostrar = document.getElementById('Mostrar');

        const priorities = {
            '1': 'Alta Importancia',
            '2': 'Importante',
            '3': 'Baja Importancia'
        };

        function agregar() {
            const description = Description.value.trim();
            const priority = Prioridad.value;


            const taskItem = document.createElement('li');
            taskItem.className = `list-group-item d-flex justify-content-between align-items-center`;
            taskItem.dataset.priority = priority;

            const taskText = document.createElement('span');
            taskText.textContent = `${description} - ${priorities[priority]}`;
            
            const actionsDiv = document.createElement('div');

            const editar = document.createElement('button');
            editar.className = 'btn btn-warning btn-sm me-2';
            editar.textContent = 'Editar';
            editar.onclick = () => editar(taskItem, taskText);

            const eliminar = document.createElement('button');
            eliminar.className = 'btn btn-danger btn-sm';
            eliminar.textContent = 'Eliminar';
            eliminar.onclick = () => taskItem.remove();

            actionsDiv.appendChild(editar);
            actionsDiv.appendChild(eliminar);

            taskItem.appendChild(taskText);
            taskItem.appendChild(actionsDiv);

            Mostrar.appendChild(taskItem);

            ordenar();

            Description.value = '';
            Prioridad.value = '';
        }

        function editar(taskItem, taskText) {
            const [description, priorityText] = taskText.textContent.split(' - ');
            const priority = Object.keys(priorities).find(key => priorities[key] === priorityText);

            Description.value = description;
            Prioridad.value = priority;

            taskItem.remove();
        }

        function ordenar() {
            const tasks = Array.from(Mostrar.children);
            tasks.sort((a, b) => a.dataset.priority - b.dataset.priority);

            Mostrar.innerHTML = '';
            tasks.forEach(task => Mostrar.appendChild(task));
        }

        Guardar.addEventListener('click', agregar);
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
